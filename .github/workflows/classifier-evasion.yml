name: "classifier: evasion"
# Scores an evasion-transformed attack coverage corpus (readable transforms) with the chosen classifier.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Classifier to score; each choice is defined in tools/classifier-score/models.json
        type: choice
        options:
          - protectai
          - deepset
          - horizon-labs
        default: protectai
      transform:
        description: Readable evasion transform applied to the injected payload
        type: choice
        options:
          - framing
          - field_split
          - leet
        default: framing
      threshold:
        description: Decision threshold for the comparison
        type: choice
        options:
          - '0.5'
          - '0.8'
          - '0.9'
          - '0.95'
          - '0.99'
        default: '0.5'
permissions:
  contents: read
jobs:
  score:
    uses: ./.github/workflows/classifier-score.yml
    with:
      model: ${{ inputs.model }}
      corpus: attacks-${{ inputs.transform }}
      threshold: ${{ inputs.threshold }}
      timeout: 180
