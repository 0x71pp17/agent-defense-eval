name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -cover ./...
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: install exporter dependencies
        run: pip install -r tools/agentdojo-export/requirements.txt
      - name: regenerate both corpora and compare with the committed copies
        working-directory: tools/agentdojo-export
        run: |
          python export.py /tmp/agentdojo-v1.2.json
          python pairs.py /tmp/agentdojo-v1.2-pairs.json
          python pairs.py --attacks /tmp/agentdojo-v1.2-attacks.json
          for f in ../../sources/agentdojo/transformed/agentdojo-v1.2-attacks-*.json; do
            t=$(basename "$f" .json); t=${t#agentdojo-v1.2-attacks-}
            python pairs.py --attacks --transform "$t" "/tmp/agentdojo-v1.2-attacks-$t.json"
          done
          cmp ../../sources/agentdojo/agentdojo-v1.2.json /tmp/agentdojo-v1.2.json
          cmp ../../sources/agentdojo/agentdojo-v1.2-pairs.json /tmp/agentdojo-v1.2-pairs.json
          cmp ../../sources/agentdojo/agentdojo-v1.2-attacks.json /tmp/agentdojo-v1.2-attacks.json
          for f in ../../sources/agentdojo/transformed/agentdojo-v1.2-attacks-*.json; do
            t=$(basename "$f" .json); t=${t#agentdojo-v1.2-attacks-}
            cmp "$f" "/tmp/agentdojo-v1.2-attacks-$t.json"
          done
      - name: scorer unit tests
        working-directory: tools/classifier-score
        run: python -m unittest -v test_score
      - name: transform unit tests
        working-directory: tools/agentdojo-export
        run: python -m unittest -v test_transforms
      - name: scorer and defense agree on the texts to score
        run: |
          (cd tools/classifier-score && python score.py --corpus ../../sources/agentdojo/agentdojo-v1.2-pairs.json --list-keys) > /tmp/scorer-keys.txt
          (cd tools/classifier-score && python score.py --corpus ../../sources/agentdojo/agentdojo-v1.2-attacks.json --benign-corpus ../../sources/agentdojo/agentdojo-v1.2-pairs.json --list-keys) > /tmp/scorer-attacks-keys.txt
          mkdir -p /tmp/tfkeys
          for f in sources/agentdojo/transformed/agentdojo-v1.2-attacks-*.json; do
            t=$(basename "$f" .json); t=${t#agentdojo-v1.2-attacks-}
            (cd tools/classifier-score && python score.py --corpus "../../$f" --benign-corpus ../../sources/agentdojo/agentdojo-v1.2-pairs.json --list-keys) > "/tmp/tfkeys/$t.txt"
          done
          SCORER_KEYS_FILE=/tmp/scorer-keys.txt SCORER_ATTACKS_KEYS_FILE=/tmp/scorer-attacks-keys.txt SCORER_TRANSFORM_KEYS_DIR=/tmp/tfkeys go test -run 'TestScorerKeysMatchDefense' -v ./sources/agentdojo
