name: classifier
on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model id of a prompt-injection classifier
        default: protectai/deberta-v3-base-prompt-injection-v2
        required: true
      revision:
        description: Model commit to load; the default is the revision behind the published results. Leave empty for the model's current version.
        default: 90c9989b1a342275dd0d1a95aad283c04e075671
        required: false
      positive_label:
        description: The model's label meaning injection
        default: INJECTION
        required: true
      threshold:
        description: Decision threshold
        default: '0.5'
        required: true
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL: ${{ inputs.model }}
      REVISION: ${{ inputs.revision }}
      POSITIVE_LABEL: ${{ inputs.positive_label }}
      THRESHOLD: ${{ inputs.threshold }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: install scorer dependencies
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/classifier-score/requirements.txt
      - name: score the paired corpus
        run: |
          python tools/classifier-score/score.py \
            --corpus sources/agentdojo/agentdojo-v1.2-pairs.json \
            --model "$MODEL" --revision "$REVISION" --positive-label "$POSITIVE_LABEL" --out scores.json
      - name: record the Python environment
        run: pip freeze > environment.txt
      - name: compare defenses
        run: go run ./cmd/deveval -corpus pairs -scores scores.json -threshold "$THRESHOLD" | tee results.txt
      - uses: actions/upload-artifact@v6
        with:
          name: classifier-scores
          path: |
            scores.json
            results.txt
            environment.txt
