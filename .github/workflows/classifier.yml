name: classifier
on:
  workflow_dispatch:
    inputs:
      model:
        description: Classifier to score; each choice is defined in tools/classifier-score/models.json
        type: choice
        options:
          - protectai
          - deepset
          - horizon-labs
        default: protectai
      threshold:
        description: Decision threshold for the comparison
        type: choice
        options:
          - '0.5'
          - '0.8'
          - '0.9'
          - '0.95'
          - '0.99'
        default: '0.5'
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODEL_KEY: ${{ inputs.model }}
      THRESHOLD: ${{ inputs.threshold }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false
      - name: install scorer dependencies
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/classifier-score/requirements.txt
      - name: score the paired corpus
        run: |
          python tools/classifier-score/score.py \
            --corpus sources/agentdojo/agentdojo-v1.2-pairs.json \
            --model-key "$MODEL_KEY" --out scores.json
      - name: record the Python environment
        run: pip freeze > environment.txt
      - name: compare defenses
        run: go run ./cmd/deveval -corpus pairs -scores scores.json -threshold "$THRESHOLD" | tee results.txt
      - uses: actions/upload-artifact@v6
        with:
          name: classifier-scores-${{ inputs.model }}
          path: |
            scores.json
            results.txt
            environment.txt
